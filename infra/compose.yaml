# Loop — one box, Docker Compose, Caddy terminating TLS.
#
# Services are separate containers so they restart and log independently, but
# they share one Postgres and are reachable only on the internal network: the
# gateway is the single ingress. Total idle footprint is under 700 MB with the
# model unloaded.
#
# Each service connects as its own database role, so the grants in migration 003
# are the enforcement of "only the pipeline writes to the event log" — and RLS
# actually applies, which it does not for a superuser.

name: loop

x-service: &service
  build:
    context: ..
    dockerfile: infra/Dockerfile
  restart: always
  env_file: ../.env
  depends_on:
    postgres:
      condition: service_healthy
    # Every service but `migrate` itself waits for the schema. Without this a
    # worker starts against a database with no tables, crashes, and restarts
    # until the migration happens to land — which works, and fills the log with
    # a failure that is really a race.
    migrate:
      condition: service_completed_successfully
  networks: [internal]
  # Only the API serves HTTP. The image's healthcheck asks `/health` for a
  # port the queue-driven services do not open, so it is off by default and
  # turned back on for the one container that can answer it.
  healthcheck:
    disable: true
  environment: &service-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # JSON lines, because these are shipped somewhere rather than read in a
    # terminal. `loop.runtime.log` allow-lists the fields either way.
    LOG_FORMAT: json
    # Derived here rather than read from .env, and `environment` outranks
    # `env_file` so this wins. The DATABASE_URL in .env is the one host-side
    # tooling uses — migrate, seed_user, dev.py — and it necessarily names
    # a published port on localhost. Inside this network there is no published
    # port and the host is `postgres`, so the two cannot be the same string.
    # Composing it from POSTGRES_PASSWORD is also what stops the URL and the
    # password the database was created with from drifting apart.
    DATABASE_URL: postgres://loop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/loop

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, edge]
    depends_on: [gateway]

  postgres:
    build:
      context: ./postgres
    restart: always
    environment:
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: loop
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loop -d loop']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    # Publishes nothing: only the containers on `internal` can reach it.

  migrate:
    <<: *service
    restart: 'no'
    # Overridden: this is the thing every other service waits for.
    depends_on:
      postgres: { condition: service_healthy }
    command: ['python', '-m', 'loop', 'migrate']

  gateway:
    <<: *service
    # `api`, not `gateway`. The container keeps the old name so the Caddyfile
    # and every `docker compose logs gateway` in the runbook still work; the
    # process inside it is `python -m loop api`.
    command: ['python', '-m', 'loop', 'api']
    environment:
      <<: *service-env
      DB_ROLE: loop_gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request, sys
          port = os.environ.get('PORT', '3000')
          url = 'http://127.0.0.1:' + port + '/health'
          sys.exit(0 if urllib.request.urlopen(url).status == 200 else 1)
      interval: 30s
      timeout: 3s
      start_period: 10s
    expose: ['3000']

  connector:
    <<: *service
    command: ['python', '-m', 'loop', 'connector']
    environment:
      <<: *service-env
      DB_ROLE: loop_connector

  classifier:
    <<: *service
    command: ['python', '-m', 'loop', 'classifier']
    environment:
      <<: *service-env
      DB_ROLE: loop_classifier

  extractor:
    <<: *service
    command: ['python', '-m', 'loop', 'extractor']
    environment:
      <<: *service-env
      DB_ROLE: loop_extractor

  resolver:
    <<: *service
    command: ['python', '-m', 'loop', 'resolver']
    environment:
      <<: *service-env
      DB_ROLE: loop_resolver

  pipeline:
    <<: *service
    command: ['python', '-m', 'loop', 'pipeline']
    environment:
      <<: *service-env
      DB_ROLE: loop_pipeline

  nudge:
    <<: *service
    command: ['python', '-m', 'loop', 'nudge']
    environment:
      <<: *service-env
      DB_ROLE: loop_nudge

  notifier:
    <<: *service
    command: ['python', '-m', 'loop', 'notifier']
    environment:
      <<: *service-env
      DB_ROLE: loop_notifier

  # Rung 3, off unless asked for. Steady state is a trickle of three messages a
  # day, and the model unloads when idle — which is 99% of the time.
  #   docker compose --profile model up -d llama
  llama:
    image: ghcr.io/ggerganov/llama.cpp:server
    profiles: [model]
    restart: unless-stopped
    command: ['--host', '0.0.0.0', '--port', '8080', '-ngl', '0', '-m', '/models/model.gguf']
    volumes:
      - ../models:/models:ro
    networks: [internal]
    expose: ['8080']

  # The backfill profile. Continuous batching turns a 12-month first scan from
  # hours into minutes; it is brought up on demand and stopped again.
  #   docker compose --profile batch up vllm
  vllm:
    image: vllm/vllm-openai:latest
    profiles: [batch]
    restart: 'no'
    command: ['--model', '${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}', '--port', '8000']
    networks: [internal]
    expose: ['8000']

networks:
  internal:
    internal: true
  edge: {}

volumes:
  caddy_data:
  caddy_config:
