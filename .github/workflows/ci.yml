name: ci

# The gates from Engineering Spec §17, run on every commit.
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }

      # `ruff check` and `mypy`, which is what backend/README.md documents as
      # the gates. `ruff format` is deliberately not one of them: most of the
      # tree predates it and enforcing it here would be a reformat, not a check.
      # `--extra all` everywhere, including the steps that could get away with
      # fewer: `uv run` syncs the environment to exactly the extras named, so
      # alternating between five and none made CI install and uninstall the
      # whole dependency tree half a dozen times per run.
      - run: uv run --extra all ruff check .
      - run: uv run --extra all mypy loop

      # Loop drafts follow-ups and never delivers one. This is the assertion,
      # and unlike the Node version it reads `.py` — which the whole backend is.
      - run: uv run --extra all python scripts/assert_no_send_path.py

      # Intent precision ≥ 0.97, recall ≥ 0.90, and zero false negatives on the
      # LinkedIn/Indeed fixtures. Prints the confusion matrix either way.
      - run: uv run --extra all python scripts/corpus_gate.py

      # The corpus is generated, and a corpus that has drifted from its
      # generator is a corpus nobody can regenerate.
      - run: uv run --extra all python scripts/gen_fixtures.py --check

      # The same image compose uses, so the extensions and the RLS roles are
      # the ones the tests are making claims about. `test_db.py up` builds it
      # when it is missing, which is the only place that build is described —
      # a step here as well would be a second copy of the tag and the context
      # to keep in agreement, and would make `up`'s build branch unreachable in
      # the one environment that would ever exercise it.
      - run: uv run --extra all python scripts/test_db.py up

      # RLS, append-only, idempotency, rebuild, erasure — against a real
      # Postgres, because the interesting bugs live in SQL. Without
      # DATABASE_URL every integration test skips, which reads as green.
      - run: uv run --extra all pytest
        env:
          DATABASE_URL: postgres://loop:loop@localhost:55432/loop

      # The whole pipeline against a stubbed Google: five services, real
      # queues, real roles. The one test that exercises them together.
      - run: uv run --extra all python scripts/e2e.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The image is what actually deploys, and until now nothing built it. Both
  # jobs above were green on a tree whose `docker compose build` could not get
  # past parsing — so this job exists to make "CI passed" cover the artefact
  # that ships, not only the two it is assembled from.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose interpolates `${POSTGRES_PASSWORD:?…}` at parse time and reads
      # it from the project directory, so a real file has to be there before
      # anything is built. Copying the example is also the check that the
      # example still carries every variable compose requires — and that this
      # is a plain `cp` with no `--env-file` after it is the assertion that
      # compose.yaml is still somewhere the root `.env` reaches.
      - name: Write the .env compose parses
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-not-a-secret/' .env

      # Nine services, one `image:`, so this builds once rather than nine times.
      - run: docker compose build
